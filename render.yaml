services:
  - type: web
    name: assetpulse-api
    runtime: node
    buildCommand: npm ci && npm run build --workspace=@assetpulse/db && npm run build --workspace=@assetpulse/server
    preDeployCommand: npm run db:deploy
    startCommand: npm run start --workspace=@assetpulse/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false